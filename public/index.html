<!DOCTYPE html>
<html lang="zh-Hant" data-theme="tiffany">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>留學生活儀表板</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%230ABAB5%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="app-shell">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">留學生活</span>
    </div>
    <div class="theme-switch" role="group" aria-label="切換主題色">
      <button class="theme-dot" data-theme-btn="tiffany" style="--dot:#0ABAB5" aria-label="蒂芬妮綠"></button>
      <button class="theme-dot" data-theme-btn="sky" style="--dot:#4FA3E0" aria-label="天藍色"></button>
      <button class="theme-dot" data-theme-btn="yolk" style="--dot:#F3B93B" aria-label="鵝黃色"></button>
    </div>
  </header>

  <main class="content">

    <!-- ===== 儀表板 ===== -->
    <section class="view" id="view-dashboard">
      <div class="panel">
        <div class="period-controls">
          <div class="period-type-switch">
            <button class="seg-btn active" data-period-type="week">週</button>
            <button class="seg-btn" data-period-type="month">月</button>
          </div>
          <div class="period-nav">
            <button class="icon-btn" id="btnPrevPeriod">‹</button>
            <span id="periodLabel" class="period-label">本週</span>
            <button class="icon-btn" id="btnNextPeriod">›</button>
          </div>
        </div>

        <canvas id="hexChart" height="280"></canvas>

        <div class="legend-row">
          <span><span class="legend-dot legend-blue"></span>既定行程投入</span>
          <span><span class="legend-dot legend-orange"></span>行程外的行動</span>
        </div>
      </div>

      <div id="imbalanceCard" class="imbalance-card hidden">
        <p id="imbalanceText"></p>
      </div>

      <div id="satisfactionCard" class="imbalance-card hidden">
        <p id="satisfactionText"></p>
      </div>
    </section>

    <!-- ===== 輸入 ===== -->
    <section class="view hidden" id="view-input">
      <div class="panel">
        <div class="input-kind-switch">
          <button class="seg-btn active" data-kind="action">今日行動</button>
          <button class="seg-btn" data-kind="plan">計畫/行程</button>
        </div>
        <form id="entryForm" class="form-grid">
          <label class="field">
            <span>向度</span>
            <div class="dimension-picker" id="dimensionPicker"></div>
          </label>
          <label class="field" id="fieldEntryDate">
            <span>日期</span>
            <input type="date" id="en-date">
          </label>
          <label class="field">
            <span>內容描述</span>
            <input type="text" id="en-desc" required placeholder="做了什麼？／排定了什麼？">
          </label>
          <label class="field">
            <span>投入程度：<span id="en-intensity-value">3</span></span>
            <div class="dot-scale-5" id="intensityDots"></div>
          </label>
          <label class="field">
            <span>滿意度：<span id="en-satisfaction-value">3</span></span>
            <div class="dot-scale-5" id="satisfactionDots"></div>
          </label>
          <button type="submit" class="btn-primary full">儲存</button>
        </form>
      </div>
      <div class="panel">
        <h2 class="panel-title">最近的紀錄</h2>
        <ul class="note-list" id="recentEntriesList"></ul>
      </div>
    </section>

    <!-- ===== 城市 ===== -->
    <section class="view hidden" id="view-city">
      <div class="panel city-scene-panel" id="citySceneContainer"></div>
      <div id="buildingDetailPanel" class="panel hidden">
        <div class="building-detail-head">
          <h2 class="panel-title" id="buildingDetailTitle"></h2>
          <button class="btn-ghost small" id="btnCloseBuildingDetail">關閉</button>
        </div>
        <div id="buildingDetailIcon" class="building-detail-icon"></div>
        <p id="buildingDetailLevel" class="building-detail-level"></p>
        <ul class="note-list" id="buildingDetailList"></ul>
      </div>
    </section>

    <!-- ===== 隨手記 ===== -->
    <section class="view hidden" id="view-notes">
      <div class="panel">
        <h2 class="panel-title">隨手記一筆</h2>
        <p class="panel-hint">未開始的計畫、想法先寫下來，之後可以一鍵轉成正式紀錄。</p>
        <form id="noteForm" class="inline-form">
          <input type="text" id="note-content" placeholder="現在腦中在想什麼？" required>
          <button type="submit" class="btn-primary">記下</button>
        </form>
      </div>
      <div class="panel">
        <h2 class="panel-title">待整理（<span id="untriagedCount">0</span>）</h2>
        <ul class="note-list" id="untriagedList"></ul>
      </div>
      <div class="panel">
        <h2 class="panel-title">已整理</h2>
        <ul class="note-list muted" id="triagedList"></ul>
      </div>
    </section>

    <div class="panel">
      <h2 class="panel-title">測試用途</h2>
      <p class="panel-hint">清空所有紀錄、隨手記與地點設定，重新開始測試。這個動作無法復原。</p>
      <button class="btn-ghost full" id="btnResetTestData">清空所有測試資料</button>
    </div>

  </main>

  <nav class="tabbar">
    <button class="tab-btn active" data-view="dashboard"><span>儀表板</span></button>
    <button class="tab-btn" data-view="input"><span>輸入</span></button>
    <button class="tab-btn" data-view="city"><span>城市</span></button>
    <button class="tab-btn" data-view="notes"><span>隨手記</span></button>
  </nav>

</div>

<!-- 轉為正式紀錄的小表單（隨手記用） -->
<div id="promoteModal" class="modal-overlay hidden">
  <div class="modal-card">
    <h3>轉為正式紀錄</h3>
    <div class="input-kind-switch" id="promoteKindSwitch">
      <button type="button" class="seg-btn active" data-kind="action">今日行動</button>
      <button type="button" class="seg-btn" data-kind="plan">計畫/行程</button>
    </div>
    <label class="field">
      <span>向度</span>
      <div class="dimension-picker" id="promoteDimensionPicker"></div>
    </label>
    <label class="field">
      <span>日期</span>
      <input type="date" id="promote-date">
    </label>
    <label class="field">
      <span>投入程度：<span id="promote-intensity-value">3</span></span>
      <div class="dot-scale-5" id="promoteIntensityDots"></div>
    </label>
    <label class="field">
      <span>滿意度：<span id="promote-satisfaction-value">3</span></span>
      <div class="dot-scale-5" id="promoteSatisfactionDots"></div>
    </label>
    <div class="modal-actions">
      <button class="btn-ghost" id="btnCancelPromote">取消</button>
      <button class="btn-primary" id="btnConfirmPromote">確認轉換</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="/buildings.js"></script>
<script src="/app.js"></script>
</body>
</html>
